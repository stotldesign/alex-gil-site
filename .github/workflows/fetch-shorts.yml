name: Fetch short-form covers

# Runs when work/shorts.json changes (or by hand from the Actions tab).
on:
  push:
    branches: [main]
    paths: ["work/shorts.json", "work/fetch_shorts.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
      - name: Download and convert
        run: python3 work/fetch_shorts.py
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/shorts public/data/shorts.json
          git diff --cached --quiet || git commit -m "Add short-form covers"
          git push
