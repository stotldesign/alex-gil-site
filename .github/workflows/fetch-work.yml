name: Fetch design and photo images

# Runs when work/manifest.json changes (or by hand from the Actions tab).
# Downloads the images, makes web versions, and commits them to the repo.
on:
  push:
    branches: [main]
    paths: ["work/manifest.json", "work/fetch.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
      - name: Download and convert
        run: python3 work/fetch.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/work public/data/work.json
          git diff --cached --quiet || git commit -m "Add design and photo images from the old site"
          git push
